<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상한가 매매 기록</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/*__CHART_CSS__*/
</style>
</head>
<body>
<main>
  <h1>상한가 따라잡기(ULC) 매매 기록</h1>
  <p class="sub" id="sub"></p>
  <div class="kpis" id="kpis"></div>
  <div class="tablewrap"><table id="summary"></table></div>
  <div class="legend">
    <span><b style="color:#d32f2f">▲ B</b> 매수 · <b style="color:#1565c0">▼ S</b> 매도 (주문별)</span>
    <span>캔들 안 <b style="color:#d32f2f">✕</b><b style="color:#1565c0">✕</b> = 체결 건별 체결가</span>
    <span><i style="border-color:#2962FF"></i>MA5</span><span><i style="border-color:#FF4FA3"></i>MA10</span>
    <span><i style="border-color:#FF9800"></i>MA20</span><span><i style="border-color:#26A65B"></i>MA60</span>
    <span><i style="border-color:#6b7280;border-top-style:dashed"></i>X 전일 종가</span>
    <span><i style="border-color:#10b981;border-top-style:dotted"></i>Z 당일 시가</span>
    <span><i style="border-color:var(--avg)"></i>최종 평단</span>
  </div>
  <div id="cards"></div>
</main>
<script>
/*__CHART_JS__*/

const DATA = __DATA__;
const hhmm = t => iso(t).slice(11, 19);
const resultTag = t => `<span class="tag ${t.result === "미청산" ? "open" : t.pnl > 0 ? "win" : "loss"}">${t.result}</span>`;

const T = DATA.trades;
const closed = T.filter(t => t.pnl != null);
const totPnl = closed.reduce((s, t) => s + t.pnl, 0);
const totBuy = closed.reduce((s, t) => s + t.buy_a, 0);
const wins = closed.filter(t => t.pnl > 0).length;
document.getElementById("sub").textContent =
  `${DATA.account} 계좌 체결 기록(${DATA.trades_file}) + 엔진 로그 기준 · ${dayStr(T[0].day)} ~ ${dayStr(T[T.length-1].day)} · 생성 ${DATA.generated} · 손익은 수수료·세금 제외`;
document.getElementById("kpis").innerHTML = [
  ["매매", `${T.length}건`], ["청산 완료", `${closed.length}건 (승 ${wins} / 패 ${closed.length - wins})`],
  ["실현 손익 합계", `<span class="${cls(totPnl)}">${signed(totPnl)}원</span>`],
  ["매수금액 대비", `<span class="${cls(totPnl)}">${pct(totPnl / totBuy * 100)}</span>`],
].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");

document.getElementById("summary").innerHTML =
  `<thead><tr><th>날짜</th><th>종목</th><th>결과</th><th>시나리오</th><th>매수 차수</th><th>매수금액</th><th>평단</th><th>실현 손익</th><th>수익률</th></tr></thead><tbody>` +
  T.map((t, i) => {
    const nb = t.orders.filter(o => o.side === "buy").length;
    const r = t.pnl == null ? null : t.pnl / t.buy_a * 100;
    return `<tr data-i="${i}"><td>${dayStr(t.day)}</td><td>${t.name} <span class="meta">${t.code}</span></td><td>${resultTag(t)}</td>
      <td>SC${t.sc ?? "?"}</td><td>${nb}</td><td>${fmt(t.buy_a)}</td><td>${fmt(t.buy_a / t.buy_q)}</td>
      <td class="${cls(r)}">${signed(t.pnl)}</td><td class="${cls(r)}">${r == null ? "—" : pct(r)}</td></tr>`;
  }).join("") + `</tbody>`;
wireSummary();

const cards = document.getElementById("cards");
T.forEach((t, i) => {
  const card = document.createElement("section");
  card.className = "card"; card.id = "c" + i;
  const avg = t.buy_a / t.buy_q;
  card.innerHTML = `
    <div class="head"><h2>${t.name} <span class="meta">${t.code}</span></h2>
      <span class="meta">${dayStr(t.day)} · SC${t.sc ?? "?"} · X(전일 종가) ${fmt(t.x)} · Z(시가) ${fmt(t.z)} · 평단 ${fmt(avg)}</span>
      ${resultTag(t)}
      <span class="${cls(t.pnl)}"><b>${t.pnl == null ? "손익 미산정" : signed(t.pnl) + "원 (" + pct(t.pnl / t.buy_a * 100) + ")"}</b></span>
    </div>
    ${t.notes.length ? `<ul class="notes">${t.notes.map(n => `<li>⚠ ${n}</li>`).join("")}</ul>` : ""}
    <div class="charts">
      <div class="chartbox"><div class="cap">3분봉 · ${dayStr(t.day)} 정규장 (왼쪽은 전일) <button class="tog" id="b${i}">전체 보기</button></div><div class="chart" id="m${i}"></div></div>
      <div class="chartbox"><div class="cap">일봉 · 매매일 표시 (마우스 휠·드래그로 이동)</div><div class="chart" id="d${i}"></div></div>
    </div>
    <div class="tablewrap orders"><table><thead><tr><th>시각</th><th>구분</th><th>사유</th><th>수량</th><th>체결 평균가</th><th>금액</th></tr></thead><tbody>
      ${t.orders.map(o => `<tr><td>${hhmm(o.time)}</td><td class="${o.side === "buy" ? "pos" : "neg"}">${o.side === "buy" ? "매수" : "매도"}</td>
        <td>${o.label}</td><td>${o.qty.toLocaleString()}</td><td>${o.price.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}</td><td>${fmt(o.amt)}</td></tr>`).join("")}
    </tbody></table></div>`;
  addBackButton(card, i);
  cards.appendChild(card);

  // 3분봉: 체결 ✕ + 주문별 B/S(사유) + X·Z·평단선. 처음엔 매매 구간 확대, [전체 보기]로 하루 전체.
  const m3 = t.min3;
  const M = makeChart(document.getElementById("m" + i), m3, true);
  addPriceLines(M.series, [[t.x, "#6b7280", 2, "X"], [t.z, "#10b981", 1, "Z"], [avg, "#f59e0b", 0, "평단"]]);
  M.series.setMarkers(orderMarkers(m3, t.orders, g => `${g.side === "buy" ? "B" : "S"} ${g.labels.join("·")}`).sort((a, b) => a.time - b.time));
  addFillCrosses(M.series, m3, t.fills);
  const lastIdx = Math.max(...t.orders.map(o => m3.findIndex(b => b.time === barAt(m3, o.time))));
  let full = false;
  M.fit = () => M.chart.timeScale().setVisibleLogicalRange(full
    ? { from: t.prev_n - 2, to: m3.length + 1 }
    : { from: t.prev_n - 2, to: Math.min(m3.length + 1, Math.max(lastIdx + 20, t.prev_n + 40)) });
  const btn = document.getElementById("b" + i);
  btn.onclick = () => { full = !full; btn.textContent = full ? "매매 구간 확대" : "전체 보기"; M.fit(); };

  // 일봉: 매매일 봉에 매수 평단·매도 평균 마커 + 체결 ✕
  const rows = DATA.daily[t.code];
  const D = makeChart(document.getElementById("d" + i), rows, false);
  const idx = rows.findIndex(b => ymdOf(b.time) === t.day);
  if (idx >= 0) {
    const tm = rows[idx].time;
    const mk = [{ time: tm, position: "belowBar", shape: "arrowUp", color: TRADE_COLORS.buy, text: `B ${t.buy_q}주 · ${fmt(avg)}` }];
    if (t.sell_q) mk.push({ time: tm, position: "aboveBar", shape: "arrowDown", color: TRADE_COLORS.sell,
      text: `S ${t.sell_q}주 · ${fmt(t.sell_a / t.sell_q)}` });
    D.series.setMarkers(mk);
    addFillCrosses(D.series, rows, t.fills, () => tm);
    D.fit = () => D.chart.timeScale().setVisibleLogicalRange({ from: Math.max(-1, idx - 35), to: Math.max(rows.length + 6, idx + 15) });
  }
  M.fit(); D.fit();
});
</script>
</body>
</html>
