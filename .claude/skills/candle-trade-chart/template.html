<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대금 양봉 매매 기록</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/*__CHART_CSS__*/
.log { margin-top: 10px; font-size: 12px; color: var(--muted); }
.log summary { cursor: pointer; }
.log ol { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<main>
  <h1>대금 양봉·구간 매매 기록</h1>
  <p class="sub" id="sub"></p>
  <div class="kpis" id="kpis"></div>
  <div class="tablewrap"><table id="summary"></table></div>
  <div class="legend">
    <span><b style="color:#d32f2f">▲ B</b> 매수 · <b style="color:#1565c0">▼ S</b> 매도 (주문별)</span>
    <span>캔들 안 <b style="color:#d32f2f">✕</b><b style="color:#1565c0">✕</b> = 체결 건별 체결가</span>
    <span><b style="color:#7b1fa2">▼</b> 기준봉</span>
    <span><i style="border-color:#7b1fa2;border-top-style:dashed"></i>매입 구간 상단·하단</span>
    <span><i style="border-color:#f59e0b"></i>평단</span>
    <span><i style="border-color:#e5383b;border-top-style:dotted"></i>익절선</span>
    <span><b style="color:#b45309">■</b> <span class="handoff-legend"></span>수동 전환 이후</span>
    <span><i style="border-color:#2962FF"></i>MA5</span><span><i style="border-color:#FF4FA3"></i>MA10</span>
    <span><i style="border-color:#FF9800"></i>MA20</span><span><i style="border-color:#26A65B"></i>MA60</span>
  </div>
  <div id="cards"></div>
</main>
<script>
/*__CHART_JS__*/

const DATA = __DATA__;
const md = d => `${d.slice(4,6)}/${d.slice(6)}`;
const when = t => `${iso(t).slice(5, 10).replace("-", "/")} ${iso(t).slice(11, 19)}`;
const KIND = { candle: "대금 양봉", zone: "구간 매매" };
const total = t => t.pnl + (t.unreal || 0);
const statusTag = t => `<span class="tag ${t.status === "보유 중" ? "open" : t.pnl > 0 ? "win" : "loss"}">${t.status}</span>`;
const zoneStr = t => t.zone ? fmt(t.zone[0]) + " ~ " + fmt(t.zone[1]) : "—";
// 매입 구간 상단·하단, 평단, 익절선(평단 × (1+p%))
const tradeLines = t => [
  ...(t.zone ? [[t.zone[1], ANCHOR_COLOR, 2, "구간 상단"], [t.zone[0], ANCHOR_COLOR, 2, "구간 하단"]] : []),
  [t.avg, "#f59e0b", 0, "평단"],
  [t.avg && t.tp ? t.avg * (1 + t.tp / 100) : null, "#e5383b", 1, `익절 +${t.tp}%`],
];

const T = DATA.trades;
const sumR = T.reduce((s, t) => s + t.pnl, 0), sumU = T.reduce((s, t) => s + (t.unreal || 0), 0);
document.getElementById("sub").textContent =
  `${DATA.account} 계좌 체결 기록(${DATA.trades_file}) + 엔진 로그 기준 · 생성 ${DATA.generated} · 손익은 수수료·세금 제외`;
document.getElementById("kpis").innerHTML = [
  ["매매", `${T.length}건 (보유 중 ${T.filter(t => t.hold > 0).length})`],
  ["실현 손익", `<span class="${cls(sumR)}">${signed(sumR)}원</span>`],
  ["평가 손익(보유분)", `<span class="${cls(sumU)}">${signed(sumU)}원</span>`],
  ["합계", `<span class="${cls(sumR + sumU)}">${signed(sumR + sumU)}원</span>`],
].map(([k, v]) => `<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");

document.getElementById("summary").innerHTML =
  `<thead><tr><th>등록일</th><th>종목</th><th>상태</th><th>방식</th><th>매입 구간</th><th>매수금액</th><th>평단</th><th>보유</th><th>실현</th><th>평가</th><th>합계 수익률</th></tr></thead><tbody>` +
  T.map((t, i) => `<tr data-i="${i}"><td>${dayStr(t.reg)}</td><td>${t.name} <span class="meta">${t.code}</span></td><td>${statusTag(t)}</td>
    <td>${KIND[t.kind]}</td><td>${zoneStr(t)}</td><td>${fmt(t.buy_a)}</td><td>${fmt(t.avg)}</td>
    <td>${t.hold ? t.hold.toLocaleString() + "주" : "—"}</td><td class="${cls(t.pnl)}">${signed(t.pnl)}</td>
    <td class="${cls(t.unreal)}">${signed(t.unreal)}</td><td class="${cls(total(t))}">${pct(total(t) / t.buy_a * 100)}</td></tr>`).join("") + `</tbody>`;
wireSummary();

const cards = document.getElementById("cards");
T.forEach((t, i) => {
  const card = document.createElement("section");
  card.className = "card"; card.id = "c" + i;
  const base = t.base ? ` · 기준 캔들 ${dayStr(t.base.date)} 시가 ${fmt(t.base.open)} 종가 ${fmt(t.base.close)}` : "";
  card.innerHTML = `
    <div class="head"><h2>${t.name} <span class="meta">${t.code}</span></h2>
      <span class="meta">${KIND[t.kind]} · 등록 ${dayStr(t.reg)}${base} · 구간 ${zoneStr(t)}${t.entry_days ? " · 진입 기한 " + t.entry_days + "거래일" : ""}</span>
      ${statusTag(t)}
      <span class="${cls(total(t))}"><b>${signed(total(t))}원 (${pct(total(t) / t.buy_a * 100)})</b></span>
      <span class="meta">실현 ${signed(t.pnl)} · 평가 ${signed(t.unreal)}</span>
    </div>
    ${t.notes.length ? `<ul class="notes">${t.notes.map(n => `<li>⚠ ${n}</li>`).join("")}</ul>` : ""}
    <div class="charts">
      <div class="chartbox"><div class="cap">일봉 · 기준봉·매입 구간·체결 (휠·드래그로 이동)</div><div class="chart" id="d${i}"></div></div>
      <div class="chartbox"><div class="cap"><span>3분봉 · 체결일</span><span class="days" id="days${i}"></span></div><div class="chart" id="m${i}"></div></div>
    </div>
    <div class="tablewrap orders"><table><thead><tr><th>시각</th><th>구분</th><th>사유</th><th>수량</th><th>체결 평균가</th><th>금액</th></tr></thead><tbody>
      ${t.orders.map(o => `<tr><td>${when(o.time)}</td><td class="${o.side === "buy" ? "pos" : "neg"}">${o.side === "buy" ? "매수" : "매도"}</td>
        <td>${o.label}</td><td>${o.qty.toLocaleString()}</td><td>${o.price.toLocaleString("ko-KR", { maximumFractionDigits: 1 })}</td><td>${fmt(o.amt)}</td></tr>`).join("")}
    </tbody></table></div>
    <details class="log"><summary>엔진 로그 ${t.log.length}줄${t.end_reason ? " · 종료: " + t.end_reason : ""}</summary>
      <ol>${t.log.map(x => `<li>${when(x.time)} ${x.text}</li>`).join("")}</ol></details>`;
  addBackButton(card, i);
  cards.appendChild(card);

  // 일봉: 기준봉 ▼ + 날짜별 B/S(수량·평균가) + 체결 ✕ + 구간·평단·익절선
  const rows = DATA.daily[t.daily_key];
  const D = makeChart(document.getElementById("d" + i), rows, false);
  addPriceLines(D.series, tradeLines(t));
  const dmk = orderMarkers(rows, t.orders, g => `${g.side === "buy" ? "B" : "S"} ${g.qty}주 · ${fmt(g.amt / g.qty)}`);
  const baseIdx = t.base ? rows.findIndex(b => ymdOf(b.time) === t.base.date) : -1;
  if (baseIdx >= 0) dmk.push({ time: rows[baseIdx].time, position: "aboveBar", shape: "arrowDown", color: ANCHOR_COLOR, size: 2, text: "기준봉" });
  D.series.setMarkers([...dmk, ...handoffMarkers(D.series, rows, t.handoffs)].sort((a, b) => a.time - b.time));
  addFillCrosses(D.series, rows, t.fills);
  const startIdx = baseIdx >= 0 ? baseIdx : rows.findIndex(b => b.time >= barAt(rows, t.fills[0].time));
  D.fit = () => D.chart.timeScale().setVisibleLogicalRange({ from: Math.max(-1, startIdx - 30), to: rows.length + 4 });

  // 3분봉: 체결일들을 이어 붙이고 날짜 버튼으로 이동
  const m3 = t.min3;
  const M = makeChart(document.getElementById("m" + i), m3, true);
  addPriceLines(M.series, tradeLines(t));
  M.series.setMarkers([...orderMarkers(m3, t.orders, g => `${g.side === "buy" ? "B" : "S"} ${g.labels.join("·")}`),
    ...handoffMarkers(M.series, m3, t.handoffs)].sort((a, b) => a.time - b.time));
  addFillCrosses(M.series, m3, t.fills);
  let sel = 0;
  M.fit = () => {
    const s = t.day_starts[sel], end = sel + 1 < t.day_starts.length ? t.day_starts[sel + 1].idx : m3.length;
    M.chart.timeScale().setVisibleLogicalRange({ from: s.idx - 2, to: end + 1 });
  };
  const days = document.getElementById("days" + i);
  t.day_starts.forEach((s, k) => {
    const b = document.createElement("button");
    b.className = "tog"; b.textContent = md(s.day);
    b.style.fontWeight = k === 0 ? 700 : 400;
    b.onclick = () => { sel = k; days.querySelectorAll("button").forEach((x, j) => x.style.fontWeight = j === k ? 700 : 400); M.fit(); };
    days.appendChild(b);
  });
  D.fit(); M.fit();
});
</script>
</body>
</html>
